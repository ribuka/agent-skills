# worker-quota-guard configuration (tracked in git).
#
# Format: KEY=VALUE lines; a line starting with `#` is a comment. Repeated
# ALLOW_COMMAND and SHELL_TOOL lines accumulate. A missing or invalid file
# makes the hook allow every tool call (with a warning on stderr).
#
# QUOTA_GUARD   quota-guard's check script (exactly once; `~` is expanded).
#               The hook runs it without --threshold, so the pause threshold
#               is always quota-guard's own.
# SHELL_TOOL    tool_name values whose tool_input.command is a shell command.
#               While the quota is PAUSED_QUOTA, every other tool (file read,
#               edit, search, MCP, subagents) is denied for an Orca worker.
# ALLOW_COMMAND a Python regular expression. While PAUSED_QUOTA, a shell
#               command runs only when every simple command in it matches one
#               of these patterns with re.match (anchored at its start).
#               The command is split at unquoted `;`, `&`, `|`, `(`, `)`,
#               backticks, and newlines; whitespace is collapsed to single
#               spaces. Text inside quotes stays in one simple command.

QUOTA_GUARD=~/.agents/skills/quota-guard/scripts/quota_guard.py

SHELL_TOOL=Bash
SHELL_TOOL=PowerShell

# Reach a safe boundary: inspect and record the work, then push it.
ALLOW_COMMAND=cd\b
ALLOW_COMMAND=git (add|commit|push|status|diff|log|show|rev-parse)\b
ALLOW_COMMAND=gh pr (view|checks)\b
# Report to the Coordinator.
ALLOW_COMMAND=(\S*[\\/])?orca(\.exe|\.cmd)? orchestration\b
# Quota, conversation size, and review count for the report.
ALLOW_COMMAND=uv run --no-project \S*quota-guard[\\/]scripts[\\/]quota_guard\.py\b
ALLOW_COMMAND=uv run --no-project \S*implement-review-merge[\\/]scripts[\\/]context_tokens\.py\b
ALLOW_COMMAND=bash \S*pr-cross-review[\\/]scripts[\\/]review_status\.sh\b
