# Shared defaults for lookback (tracked in git). config.local.conf next to
# this file (git-ignored, optional) overrides any of these keys.
# Format: KEY=value; the value is taken literally (no quotes, no inline comments).

# Upper bound on past sessions read in one run (newest first).
MAX_SESSIONS=10

# Upper bound on findings filed as issues in one run.
MAX_ISSUES_PER_RUN=3

# Label put on every issue this skill files; also used to find past ones.
ISSUE_LABEL=lookback

# Ask for approval of each finding before it is refined and filed: true | false
CONFIRM_BEFORE_PUBLISH=true
