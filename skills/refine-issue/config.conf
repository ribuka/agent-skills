# Shared defaults for refine-issue (tracked in git). config.local.conf next to
# this file (git-ignored, optional) overrides any of these keys.
# Format: KEY=value; the value is taken literally (no quotes, no inline comments).

# Show the finished issue to the user and wait for approval before creating
# or updating the GitHub issue (or saving the markdown file): true | false
CONFIRM_BEFORE_PUBLISH=false
