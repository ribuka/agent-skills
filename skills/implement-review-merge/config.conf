# Shared defaults for implement-review-merge (tracked in git). This file is the
# only source of these defaults: the scripts have no built-in fallbacks and stop
# if a key is missing. config.local.conf next to this file (git-ignored,
# optional) overrides any of these keys.
# Format: KEY=value; the value is taken literally (no quotes, no inline comments).

# Fast-forward the local main after a confirmed standalone merge: true | false
SYNC_LOCAL_MAIN_AFTER_MERGE=true
# Maximum seconds to wait for checks on the pushed head (positive integer).
CI_REGISTRATION_TIMEOUT_SECONDS=300
