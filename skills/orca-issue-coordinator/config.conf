# Shared defaults for orca-issue-coordinator (tracked in git). This file is the
# only source of these defaults: resolve_config.py has no built-in fallbacks and
# stops if a key is missing. config.local.conf next to this file (git-ignored,
# optional) overrides any of these keys, and command-line flags override both.
# Format: KEY=value; the value is taken literally (no quotes, no inline comments).

# Implementation workers (implement-review-merge steps 1-7)
CLAUDE_IMPL_MODEL=opus
CLAUDE_IMPL_EFFORT=medium
CODEX_IMPL_MODEL=gpt-6.1-sol
CODEX_IMPL_EFFORT=medium

# Merge-preparation workers (implement-review-merge steps 8-9)
CLAUDE_MERGE_MODEL=sonnet
CLAUDE_MERGE_EFFORT=medium
CODEX_MERGE_MODEL=gpt-6.1-sol
CODEX_MERGE_EFFORT=medium

# Maximum number of implementation workers running at once (implement-review-merge
# steps 1-7, including retries and fresh workers of that phase); an integer >= 1.
MAX_IMPL_WORKERS=1

# Maximum number of merge-preparation workers running at once (steps 8-9,
# including retries and fresh workers of that phase); an integer >= 1.
MAX_MERGE_WORKERS=1

# Conversation size (tokens) at or above which a worker stopped by the quota
# pause is resumed by a fresh worker instead of in its own conversation; an
# integer >= 1.
FRESH_WORKER_CONTEXT_TOKENS=200000
