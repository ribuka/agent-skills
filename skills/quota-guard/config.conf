# Shared defaults for quota-guard (tracked in git). This file is the single
# source of these defaults: quota_guard.py has no built-in fallbacks and returns
# UNKNOWN if a key is missing or invalid. config.local.conf next to this file
# (git-ignored, optional) overrides any of these keys, and command-line options
# (--threshold) override both.
# Format: KEY=value; the value is taken literally (no quotes, no inline comments).

# Five-hour usage percentage at or above which `check` pauses: a number in (0, 100].
THRESHOLD=95
