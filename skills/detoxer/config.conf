# Shared defaults for detoxer (tracked in git). config.local.conf next to
# this file (git-ignored, optional) overrides any of these keys.
# Format: KEY=value; the value is taken literally (no quotes, no inline comments).

# Upper bound on candidates filed in one run.
MAX_ISSUES_PER_RUN=3

# Hotspot window when neither --since nor --full is given: an integer number of
# days (files changed in the last that many days), or empty for the whole repository.
SCAN_WINDOW_DAYS=

# Label put on every issue this skill files; also used to find past ones.
ISSUE_LABEL=detoxer

# Ask for approval of each candidate before it is refined and filed: true | false
CONFIRM_BEFORE_PUBLISH=false

# After filing, implement, review, and merge each filed issue: true | false
IMPLEMENT_FILED_ISSUES=false

# How filed issues are implemented when IMPLEMENT_FILED_ISSUES=true:
#   new-session - a detached script implements them one at a time, each in a new
#                 unattended session of the same agent; this session does not wait
#   orca        - a new Orca agent terminal coordinates them with orca-issue-coordinator
#                 (parallel workers); this session does not wait
IMPLEMENT_WITH=new-session

# new-session only: kill a session still running after this many seconds.
IMPLEMENT_TIMEOUT_SECONDS=7200
# new-session only: permission mode of `claude -p`
# (acceptEdits | auto | bypassPermissions | dontAsk). The session pushes and merges.
CLAUDE_PERMISSION_MODE=bypassPermissions
# new-session only: sandbox of `codex exec`
# (workspace-write | danger-full-access); workspace-write gets network access.
CODEX_SANDBOX=danger-full-access
