# Shared defaults for qiita-post (tracked in git). qiita_post.py has no built-in
# fallbacks. config.local.conf next to this file (git-ignored, optional)
# overrides any of these keys.
# Format: KEY=value; the value is taken literally (no quotes, no inline comments).

# Directory for article files, outside this repository. `~` and %VAR% are expanded.
DRAFTS_DIR=~/Documents/qiita-post

# Comma-separated words that must never appear in an article (real name, account
# names, private repository or company names). Case-insensitive; ASCII words match
# only as whole words. Keep the real list in config.local.conf, never here.
PRIVATE_WORDS=
